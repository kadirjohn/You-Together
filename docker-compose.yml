services:
  redis:
    image: redis:7-alpine
    container_name: you-together-redis
    restart: unless-stopped
    # Redis yalnızca Docker ağı içinde (server servisine) erişilebilir olmalı.
    # Host'a port expose ETME — dışarıdan erişime kapat (hardening).
    expose:
      - '6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: ./server/Dockerfile
    container_name: you-together-server
    restart: unless-stopped
    # Host'un 3000 portu meşgul olduğu için host-side portu 3001 olarak değiştirdik.
    # Container içi yine 3000'de dinler (PORT env). Sadece 127.0.0.1'e bağladık —
    # dışarıya açık değil, reverse proxy (localhost) erişir. Güvenli.
    # Çakışma yine olursa 3001'i 3002/3003... ile değiştir.
    ports:
      - '127.0.0.1:3001:3000'
    env_file:
      - .env
    environment:
      # Compose override emniyet ağı: .env'de yanlışlıkla localhost kalsa bile
      # container içi Redis erişimi çalışsın.
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
