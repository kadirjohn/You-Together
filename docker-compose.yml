version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: you-together-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: ./server/Dockerfile
    container_name: you-together-server
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_URL: redis://redis:6379
      PUBLIC_BASE_URL: http://localhost:3000
      ROOM_MAX_USERS: 10
      ROOM_ACTIVE_TTL_SECONDS: 10800
      ROOM_EMPTY_TTL_SECONDS: 300
      CHAT_MAX_MESSAGES: 100
      PIN_MIN_LENGTH: 4
      PIN_MAX_LENGTH: 12
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
